<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet 最小画线示例</title>
    <!-- Leaflet CSS，约 4KB gzip -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Leaflet JS，约 40KB gzip -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. 初始化地图，中心设在北京附近
        var map = L.map('map').setView([39.909186, 116.397411], 5);

        // 2. 加载 OpenStreetMap 瓦片底图
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 3. 绘制第一条线：北京 -> 海南附近
        L.polyline([
            [39.909186, 116.397411],
            [18.271, 109.519]
        ], { color: 'green', weight: 3 }).addTo(map);

        // 4. 绘制第二条线：北京 -> 台湾附近
        L.polyline([
            [39.909186, 116.397411],
            [18.271, 119.519]
        ], { color: 'blue', weight: 3 }).addTo(map);
    </script>
</body>
</html>
