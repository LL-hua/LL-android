apply plugin: 'com.android.application'

android {
    namespace 'com.hdm'
    compileSdk 34

    defaultConfig {
        applicationId "com.hdm"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // ===== 配置签名信息 =====
    signingConfigs {
        release {
            // 指向你刚才生成的 keystore 路径
            storeFile file(System.getProperty("user.home") + "/hdm-release.keystore")
            storePassword "123456"  // 改成你刚才设置的密码
            keyAlias "hdm"
            keyPassword "123456"    // 改成你刚才设置的密码
        }
    }

    buildTypes {
        release {
            // 使用上面的签名
            signingConfig signingConfigs.release
            
            // 开启代码压缩和混淆
            minifyEnabled true
            // 开启资源压缩（移除无用的资源文件）
            shrinkResources true
            
            // 关键：指定混淆规则文件！
            // proguard-android-optimize.txt 是官方提供的优化规则
            // proguard-rules.pro 是你自己写的规则（就在 app 目录下）
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}